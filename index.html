        let lang = 'en';
        const grid = document.getElementById('grid');
        const searchInput = document.getElementById('search');

        // 核心渲染逻辑
        function render(list) {
            const t = i18n[lang];
            grid.innerHTML = list.map(item => {
                // 将相对路径转换为 Repo B 的绝对链接
                const repoBUrl = `https://github.com/Upppllld/OpenPastPapers/tree/main/${item.folder}`;
                
                return `
                    <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 card-hover transition-all duration-300 relative group overflow-hidden">
                        <div class="absolute -right-4 -top-4 text-7xl opacity-[0.03] group-hover:rotate-12 transition-transform">🐾</div>
                        <span class="px-3 py-1 bg-blue-50 text-blue-600 text-[10px] font-black rounded-full uppercase tracking-widest italic">${item.cat}</span>
                        <h3 class="text-lg font-bold mt-4 h-12 line-clamp-2 leading-tight group-hover:text-blue-600">${item.name}</h3>
                        <p class="text-slate-400 font-mono text-xs mt-1 mb-6">#${item.code}</p>
                        <div class="flex flex-col gap-2">
                            <a href="${item.url}" class="w-full py-3 bg-slate-900 text-white rounded-2xl text-center font-bold text-xs hover:bg-blue-600 transition-colors shadow-lg shadow-slate-200">${t.btnDl}</a>
                            <a href="${repoBUrl}" class="w-full py-3 bg-slate-50 text-slate-500 rounded-2xl text-center font-bold text-xs hover:bg-slate-100 transition-colors">${t.btnView}</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 更新 UI 语言
        function updateUI() {
            const t = i18n[lang];
            const header = document.getElementById('headerContainer');
            
            // 处理 RTL/LTR 布局切换
            header.className = `max-w-4xl mx-auto px-6 pt-16 pb-8 text-center ${t.dir}`;
            grid.className = `grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 ${t.dir}`;
            
            document.getElementById('heroTitle').innerText = t.title;
            document.getElementById('heroDesc').innerHTML = t.desc;
            searchInput.placeholder = t.search;
            
            // 执行搜索并渲染
            const filtered = data.filter(i => 
                i.name.toLowerCase().includes(searchInput.value.toLowerCase()) || 
                i.code.includes(searchInput.value)
            );
            render(filtered);
        }

        // 事件绑定
        document.getElementById('langSelector').addEventListener('change', e => {
            lang = e.target.value;
            updateUI();
        });

        searchInput.addEventListener('input', () => updateUI());
        
        // 首次加载
        updateUI();
    </script>
